<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera - Perfiles y Autenticación</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .profiles-screen { text-align: center; max-width: 900px; margin: 80px auto 30px; }
    .profiles-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .profiles-grid { display: flex; justify-content: center; align-items: center; gap: 25px; flex-wrap: wrap; }
    .profile-card { cursor: pointer; text-align: center; transition: transform 0.2s; }
    .profile-card:hover { transform: scale(1.06); }
    .profile-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid transparent; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .profile-card:hover .profile-avatar { border-color: var(--accent-color); box-shadow: 0 0 20px var(--accent-glow); }
    .profile-name { margin-top: 12px; font-weight: 600; color: var(--text-main); font-size: 1rem; }
    
    /* Botón flotante Añadir Perfil */
    .add-profile-circle {
      width: 110px; height: 110px; border-radius: 50%;
      border: 2px dashed #555; display: flex; align-items: center; justify-content: center;
      font-size: 2rem; color: #888; transition: all 0.2s;
    }
    .profile-card:hover .add-profile-circle { border-color: var(--accent-color); color: var(--accent-color); }

    /* Modal Glassmorphism para Agregar/Editar Perfil */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: none; align-items: center; justify-content: center; z-index: 2000;
    }
    .modal-box { width: 90%; max-width: 450px; padding: 30px; text-align: left; }
    .avatar-picker { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
    .avatar-option { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .avatar-option.selected { border-color: var(--accent-color); }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- Header Superior estilo App -->
  <header class="top-header">
    <div class="left-zone">
      <button class="icon-btn"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <img src="https://i.imgur.com/0QS9bH3.png" class="logo" alt="Lumera">
    </div>
    <div class="right-zone">
      <button id="headerAdminBtn" class="icon-btn" style="display:none;" title="Panel Admin" onclick="window.location.href='admin.html'">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
      <button class="icon-btn" title="Buscar"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></button>
      <button class="icon-btn" title="Configuración" onclick="openSettings()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
    </div>
  </header>

  <!-- Login Form Section -->
  <div id="authFormSection" class="glass-panel" style="max-width:400px; margin:100px auto; padding:30px; text-align:center;">
    <h2 id="authTitle">Iniciar Sesión</h2>
    <input type="email" id="authEmail" class="input-field" placeholder="Correo" style="width:100%; padding:10px; margin:10px 0; background:#111; border:1px solid #333; color:#fff;">
    <input type="password" id="authPassword" class="input-field" placeholder="Contraseña" style="width:100%; padding:10px; margin:10px 0; background:#111; border:1px solid #333; color:#fff;">
    <button id="authSubmitBtn" class="hero-btn" style="width:100%; margin-top:10px;">Entrar</button>
    <p id="authToggle" style="margin-top:15px; cursor:pointer; color:var(--text-muted); font-size:14px;">¿No tienes cuenta? Regístrate</p>
  </div>

  <!-- Vista Selección de Perfiles -->
  <div id="profilesSection" class="profiles-screen" style="display:none;">
    <h1 class="profiles-title">
      ¿Quién está viendo?
      <button class="icon-btn" title="Editar Perfiles" onclick="toggleEditProfiles()"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z"/></svg></button>
    </h1>
    <div id="profilesGrid" class="profiles-grid"></div>

    <button onclick="logoutUser()" style="margin-top:40px; background:transparent; border:1px solid #444; color:#aaa; padding:10px 24px; border-radius:6px; cursor:pointer;">Cerrar Sesión</button>
  </div>

  <!-- Modal Crear / Añadir Perfil -->
  <div id="addProfileModal" class="modal-overlay">
    <div class="modal-box glass-panel">
      <h3>Crear Nuevo Perfil</h3>
      <label style="margin-top:15px; display:block;">Nombre del Perfil</label>
      <input type="text" id="newProfName" class="input-field" placeholder="Ej: Niños, Mi Perfil" style="width:100%; padding:10px; margin:8px 0; background:#111; border:1px solid #333; color:#fff;">
      
      <label style="display:flex; align-items:center; gap:10px; margin:10px 0; cursor:pointer;">
        <input type="checkbox" id="newProfKids"> Es perfil para Niños (Kids < 10)
      </label>

      <label>Selecciona un Avatar</label>
      <div id="avatarPickerContainer" class="avatar-picker"></div>

      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="hero-btn" onclick="saveNewProfile()" style="flex:1;">Guardar</button>
        <button onclick="closeProfileModal()" style="flex:1; background:#333; color:#fff; border:none; border-radius:6px; cursor:pointer;">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Configuración (i18n + Color Secundario) -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-box glass-panel">
      <h3 data-i18n="settings">Configuración</h3>
      
      <label style="margin-top:15px; display:block;">Idioma del Sistema (i18n)</label>
      <select id="langSelector" onchange="changeLanguage(this.value)" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; margin-top:5px;">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
      </select>

      <label style="margin-top:15px; display:block;">Color Secundario de Acento</label>
      <input type="color" id="accentColorPicker" value="#d4af37" onchange="updateSecondaryColor(this.value)" style="width:100%; height:40px; background:none; border:none; cursor:pointer;">

      <button onclick="closeSettingsModal()" style="width:100%; margin-top:20px; background:#333; color:#fff; padding:10px; border:none; border-radius:6px; cursor:pointer;">Cerrar</button>
    </div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
