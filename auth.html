<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera - Autenticación</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      max-width: 420px;
      margin: 60px auto;
      padding: 30px;
      background-color: var(--bg-card);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }
    .auth-logo { width: 140px; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: var(--text-muted); }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: var(--bg-secondary);
      color: #fff;
      font-size: 15px;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-radius: 6px;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--accent-hover); }
    .toggle-auth { margin-top: 15px; font-size: 14px; color: var(--text-muted); cursor: pointer; }
    
    /* Modales de Selector de Perfiles */
    .profiles-screen { display: none; text-align: center; max-width: 800px; margin: 50px auto; }
    .profiles-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 30px; }
    .profile-card { cursor: pointer; transition: transform 0.2s; position: relative; }
    .profile-card:hover { transform: scale(1.08); }
    .profile-avatar { width: 110px; height: 110px; border-radius: 8px; object-fit: cover; border: 2px solid transparent; }
    .profile-card:hover .profile-avatar { border-color: var(--accent-color); }
    .profile-name { margin-top: 10px; font-weight: 600; }
    .admin-pencil-btn {
      position: absolute;
      top: -10px;
      right: -10px;
      background: var(--accent-color);
      color: #000;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- Formulario Login / Registro -->
  <div id="authFormSection" class="auth-container">
    <img src="https://i.imgur.com/0QS9bH3.png" alt="Lumera" class="auth-logo">
    <h2 id="authTitle" style="margin-bottom: 20px;">Iniciar Sesión</h2>
    
    <div class="input-group">
      <label>Correo Electrónico</label>
      <input type="email" id="authEmail" placeholder="tu@email.com">
    </div>
    <div class="input-group">
      <label>Contraseña</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>

    <button id="authSubmitBtn" class="btn-submit">Entrar</button>
    <div id="authToggle" class="toggle-auth">¿No tienes cuenta? Regístrate aquí</div>
  </div>

  <!-- Vista Selector de Perfiles (Se activa al autenticar) -->
  <div id="profilesSection" class="profiles-screen">
    <h1 style="font-size: 2.2rem;">¿Quién está viendo ahora?</h1>
    <div id="profilesGrid" class="profiles-grid"></div>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
