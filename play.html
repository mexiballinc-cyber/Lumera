<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumera Player</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "DM Sans", system-ui, sans-serif; }
    
    .play-shell { position: relative; width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

    /* Visualización correcta de subtítulos */
    video::cue {
      background: rgba(0, 0, 0, 0.8) !important;
      color: #ffffff !important;
      font-family: "DM Sans", system-ui, sans-serif !important;
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      padding: 4px 10px !important;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9) !important;
    }

    .play-topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 25;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .play-back-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(18, 18, 18, 0.55); backdrop-filter: blur(16px);
      color: #fff; display: grid; place-items: center; cursor: pointer; transition: 0.2s ease;
    }
    .play-back-btn:hover { border-color: var(--accent-color, #d4af37); transform: scale(1.05); color: var(--accent-color, #d4af37); }
    .play-back-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .play-brand { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.7); text-transform: uppercase; }
    .play-brand img { width: 20px; height: 20px; }

    .play-controls-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 25;
      padding: 24px 32px 28px;
      background: linear-gradient(0deg, rgba(6,6,8,0.92) 0%, rgba(6,6,8,0.4) 70%, transparent 100%);
      display: flex; flex-direction: column; gap: 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .progress-bar-wrap { position: relative; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 999px; cursor: pointer; transition: height 0.15s ease; }
    .progress-bar-wrap:hover { height: 10px; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-color, #d4af37); border-radius: 999px; position: relative; }
    .progress-handle { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); display: none; }
    .progress-bar-wrap:hover .progress-handle { display: block; }

    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .left-controls { display: flex; align-items: center; gap: 18px; min-width: 0; }
    
    .btn-play-toggle {
      width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); color: #fff;
      display: grid; place-items: center; cursor: pointer; transition: 0.2s ease;
    }
    .btn-play-toggle:hover { border-color: var(--accent-color, #d4af37); background: var(--accent-color, #d4af37); color: #000; }
    .btn-play-toggle svg { width: 22px; height: 22px; fill: currentColor; }

    .meta-text { display: flex; flex-direction: column; min-width: 0; }
    .meta-title { font-size: 1.25rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-time { font-size: 0.8rem; color: rgba(255,255,255,0.6); font-weight: 600; margin-top: 2px; }

    .right-selectors { display: flex; align-items: center; gap: 12px; }
    .glass-select-wrap {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      background: rgba(20,20,24,0.65); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px); border-radius: 12px;
    }
    .glass-select-wrap svg { width: 18px; height: 18px; fill: var(--accent-color, #d4af37); }
    .glass-select-wrap select { background: transparent; color: #fff; border: none; outline: none; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .glass-select-wrap select option { background: #141416; color: #fff; }

    body.controls-hidden .play-topbar,
    body.controls-hidden .play-controls-panel { opacity: 0; pointer-events: none; transform: translateY(8px); }
    body.controls-hidden .play-topbar { transform: translateY(-8px); }

    /* Ajustes para pantallas verticales de celular */
    @media (max-aspect-ratio: 1/1) or (max-width: 600px) {
      .play-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      video {
        width: 100vw;
        height: auto;
        max-height: 85vh;
        object-fit: contain;
      }
      .play-controls-panel {
        padding: 16px 20px 36px;
      }
      .controls-row {
        gap: 10px;
      }
      .meta-title {
        font-size: 0.95rem;
        max-width: 130px;
      }
      .glass-select-wrap {
        padding: 6px 10px;
      }
      .glass-select-wrap select {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body class="play-page">
  <div class="play-shell">
    <video id="lumeraVideoPlayer" playsinline autoplay></video>

    <header class="play-topbar">
      <button class="play-back-btn" id="backBtn" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="play-brand">
        <img src="https://i.imgur.com/cCqp6Qt.png" alt="Lumera">
        <span>Lumera Player</span>
      </div>
    </header>

    <div class="play-controls-panel">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="left-controls">
          <button class="btn-play-toggle" id="playPauseBtn" aria-label="Reproducir/Pausar">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="meta-text">
            <span class="meta-title" id="mediaTitle">Cargando...</span>
            <span class="meta-time" id="timeDisplay">00:00 / 00:00</span>
          </div>
        </div>

        <div class="right-selectors">
          <div class="glass-select-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <select id="audioSelect"></select>
          </div>
          <div class="glass-select-wrap">
            <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
            <select id="subtitleSelect"><option value="">Off</option></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="play.js"></script>
</body>
</html>
