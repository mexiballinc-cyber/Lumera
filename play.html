<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumera Player</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: "DM Sans", system-ui, sans-serif; }
    
    .play-shell { position: relative; width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

    /* Visualización correcta de subtítulos */
    video::cue {
      background: rgba(0, 0, 0, 0.8) !important;
      color: #ffffff !important;
      font-family: "DM Sans", system-ui, sans-serif !important;
      font-size: 1.15rem !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      padding: 4px 10px !important;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9) !important;
    }

    .play-topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 25;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .play-top-actions { display: flex; align-items: center; gap: 12px; }

    .play-back-btn, .play-more-btn {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18);
      background: rgba(18, 18, 18, 0.55); backdrop-filter: blur(16px);
      color: #fff; display: grid; place-items: center; cursor: pointer; transition: 0.2s ease;
    }
    .play-back-btn:hover, .play-more-btn:hover { border-color: var(--accent-color, #d4af37); transform: scale(1.05); color: var(--accent-color, #d4af37); }
    .play-back-btn svg, .play-more-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

    .play-brand { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; color: rgba(255,255,255,0.7); text-transform: uppercase; }
    .play-brand img { width: 20px; height: 20px; }

    .play-controls-panel {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 25;
      padding: 24px 32px 28px;
      background: linear-gradient(0deg, rgba(6,6,8,0.92) 0%, rgba(6,6,8,0.4) 70%, transparent 100%);
      display: flex; flex-direction: column; gap: 14px;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .progress-bar-wrap { position: relative; width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 999px; cursor: pointer; transition: height 0.15s ease; }
    .progress-bar-wrap:hover { height: 10px; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-color, #d4af37); border-radius: 999px; position: relative; }
    .progress-handle { position: absolute; right: -6px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; background: #fff; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); display: none; }
    .progress-bar-wrap:hover .progress-handle { display: block; }

    .controls-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .left-controls { display: flex; align-items: center; gap: 18px; min-width: 0; }
    
    .btn-play-toggle {
      width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); color: #fff;
      display: grid; place-items: center; cursor: pointer; transition: 0.2s ease;
    }
    .btn-play-toggle:hover { border-color: var(--accent-color, #d4af37); background: var(--accent-color, #d4af37); color: #000; }
    .btn-play-toggle svg { width: 22px; height: 22px; fill: currentColor; }

    .meta-text { display: flex; flex-direction: column; min-width: 0; }
    .meta-title { font-size: 1.25rem; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta-time { font-size: 0.8rem; color: rgba(255,255,255,0.6); font-weight: 600; margin-top: 2px; }

    .right-selectors { display: flex; align-items: center; gap: 12px; }
    .glass-select-wrap {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      background: rgba(20,20,24,0.65); border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px); border-radius: 12px;
    }
    .glass-select-wrap svg { width: 18px; height: 18px; fill: var(--accent-color, #d4af37); }
    .glass-select-wrap select { background: transparent; color: #fff; border: none; outline: none; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .glass-select-wrap select option { background: #141416; color: #fff; }

    /* Modal Lista de Episodios */
    .episodes-modal {
      position: absolute; top: 76px; right: 28px; z-index: 30;
      width: min(360px, 85vw); max-height: 70vh;
      background: rgba(14, 14, 18, 0.92); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 18px; backdrop-filter: blur(20px);
      padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
    }
    .episodes-modal[hidden] { display: none; }
    .episodes-modal h3 { font-size: 1.1rem; color: #fff; margin-bottom: 8px; }
    .ep-modal-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: rgba(255,255,255,0.05); border-radius: 10px;
      color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600;
      transition: 0.18s ease; border: 1px solid transparent; cursor: pointer;
    }
    .ep-modal-item:hover, .ep-modal-item.active {
      border-color: var(--accent-color, #d4af37); background: rgba(212,175,55,0.12);
    }

    @media (max-aspect-ratio: 1/1) or (max-width: 600px) {
      .play-shell { display: flex; align-items: center; justify-content: center; background: #000; }
      video { width: 100vw; height: auto; max-height: 85vh; object-fit: contain; }
      .play-controls-panel { padding: 16px 20px 36px; }
      .controls-row { gap: 10px; }
      .meta-title { font-size: 0.95rem; max-width: 130px; }
      .glass-select-wrap { padding: 6px 10px; }
      .glass-select-wrap select { font-size: 0.75rem; }
      .episodes-modal { right: 16px; top: 70px; }
    }
  </style>
</head>
<body class="play-page">
  <div class="play-shell">
    <video id="lumeraVideoPlayer" playsinline autoplay crossorigin="anonymous"></video>

    <header class="play-topbar">
      <button class="play-back-btn" id="backBtn" aria-label="Volver">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="play-brand">
        <img src="https://i.imgur.com/cCqp6Qt.png" alt="Lumera">
        <span>Lumera Player</span>
      </div>
      <div class="play-top-actions">
        <button class="play-more-btn" id="moreEpisodesBtn" aria-label="Lista de episodios" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <!-- Modal Flotante de Episodios -->
    <div class="episodes-modal" id="episodesModal" hidden>
      <h3 id="modalSeasonTitle">Episodios</h3>
      <div id="episodesListContainer"></div>
    </div>

    <div class="play-controls-panel">
      <div class="progress-bar-wrap" id="progressBar">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>

      <div class="controls-row">
        <div class="left-controls">
          <button class="btn-play-toggle" id="playPauseBtn" aria-label="Reproducir/Pausar">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <div class="meta-text">
            <span class="meta-title" id="mediaTitle">Cargando...</span>
            <span class="meta-time" id="timeDisplay">00:00 / 00:00</span>
          </div>
        </div>

        <div class="right-selectors">
          <div class="glass-select-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <select id="audioSelect"></select>
          </div>
          <div class="glass-select-wrap">
            <svg viewBox="0 0 24 24"><path d="M19 4H5c-1.11 0-2 .9-2 2v12c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8 7H9.5v-.5h-2v3h2V13H11v1c0 .55-.45 1-1 1H7c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1zm7 0h-1.5v-.5h-2v3h2V13H18v1c0 .55-.45 1-1 1h-3c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1h3c.55 0 1 .45 1 1v1z"/></svg>
            <select id="subtitleSelect"><option value="">Off</option></select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
    import { getLanguage } from './i18n.js';

    const params = new URLSearchParams(location.search);
    const mediaId = params.get('id');
    const requestedEp = Number(params.get('ep') || 1);
    const requestedSeason = Number(params.get('season') || 1);
    const lang = getLanguage();
    const $ = id => document.getElementById(id);

    const video = $('lumeraVideoPlayer');
    const playPauseBtn = $('playPauseBtn');
    const playIcon = $('playIcon');
    const pauseIcon = $('pauseIcon');
    const progressBar = $('progressBar');
    const progressFill = $('progressFill');
    const timeDisplay = $('timeDisplay');
    const mediaTitle = $('mediaTitle');
    const audioSelect = $('audioSelect');
    const subtitleSelect = $('subtitleSelect');
    const backBtn = $('backBtn');
    const moreBtn = $('moreEpisodesBtn');
    const modal = $('episodesModal');
    const episodesContainer = $('episodesListContainer');

    let currentMedia = null;
    let nextUrl = null;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function saveHistory(id, season, ep) {
      try {
        let history = JSON.parse(localStorage.getItem('lumera_continue_watching') || '[]');
        history = history.filter(item => (typeof item === 'string' ? item : item.id) !== id);
        history.unshift({ id, season, ep, updatedAt: Date.now() });
        localStorage.setItem('lumera_continue_watching', JSON.stringify(history.slice(0, 25)));
      } catch (e) {}
    }

    function activateSubtitleTrack(targetUrl) {
      // 1. Limpiar pistas anteriores
      Array.from(video.querySelectorAll('track')).forEach(t => t.remove());

      // 2. Apagar todas las pistas existentes en el reproductor nativo
      for (let i = 0; i < video.textTracks.length; i++) {
        video.textTracks[i].mode = 'disabled';
      }

      if (!targetUrl) return;

      // 3. Crear nueva pista
      const track = document.createElement('track');
      track.kind = 'subtitles';
      track.label = 'Subtítulo';
      track.srclang = lang;
      track.src = targetUrl;
      track.default = true;

      video.appendChild(track);

      // 4. Forzar la activación directa en el motor de HTML5 Video
      track.addEventListener('load', () => {
        for (let i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = 'showing';
        }
      });

      // Fallback inmediato
      setTimeout(() => {
        for (let i = 0; i < video.textTracks.length; i++) {
          video.textTracks[i].mode = 'showing';
        }
      }, 200);
    }

    async function init() {
      if (!mediaId) { location.href = 'home.html'; return; }
      try {
        const snap = await getDoc(doc(db, 'content', mediaId));
        if (!snap.exists()) { location.href = 'home.html'; return; }
        currentMedia = snap.data();

        saveHistory(mediaId, requestedSeason, requestedEp);

        const isSeries = currentMedia.type === 'series';
        const title = currentMedia.i18n?.[lang]?.title || currentMedia.i18n?.es?.title || currentMedia.title || 'Lumera';

        if (!isSeries) {
          mediaTitle.textContent = title;
          loadSources(currentMedia.sources, currentMedia.subtitles);
        } else {
          const seasonData = currentMedia.seasons?.find(s => Number(s.seasonNumber) === requestedSeason) || currentMedia.seasons?.[0];
          const episodeData = seasonData?.episodes?.find(e => Number(e.episodeNumber) === requestedEp) || seasonData?.episodes?.[0];

          if (episodeData) {
            const epTitle = episodeData.i18n?.[lang]?.title || episodeData.i18n?.es?.title || episodeData.title || '';
            mediaTitle.textContent = `${title} — T${seasonData.seasonNumber || requestedSeason}:E${episodeData.episodeNumber || requestedEp} ${epTitle}`;
            loadSources(episodeData.sources, episodeData.subtitles);

            const totalEpisodes = (currentMedia.seasons || []).reduce((acc, s) => acc + (s.episodes?.length || 0), 0);
            if (totalEpisodes > 1) {
              moreBtn.hidden = false;
              renderEpisodesList();
            }

            const nextEpInSeason = seasonData.episodes?.find(e => Number(e.episodeNumber) === requestedEp + 1);
            if (nextEpInSeason) {
              nextUrl = `play.html?id=${encodeURIComponent(mediaId)}&ep=${nextEpInSeason.episodeNumber}&season=${seasonData.seasonNumber || requestedSeason}`;
            } else {
              const nextSeason = currentMedia.seasons?.find(s => Number(s.seasonNumber) === (requestedSeason + 1));
              if (nextSeason?.episodes?.length) {
                nextUrl = `play.html?id=${encodeURIComponent(mediaId)}&ep=${nextSeason.episodes[0].episodeNumber || 1}&season=${nextSeason.seasonNumber}`;
              }
            }
          }
        }
      } catch (err) {
        console.error(err);
        location.href = 'home.html';
      }
    }

    function loadSources(sources = {}, subtitles = {}) {
      audioSelect.replaceChildren();
      subtitleSelect.replaceChildren();

      const subOff = document.createElement('option');
      subOff.value = "";
      subOff.textContent = "Off";
      subtitleSelect.appendChild(subOff);

      Object.keys(sources).forEach(audioLang => {
        const opt = document.createElement('option');
        opt.value = sources[audioLang];
        opt.textContent = audioLang.toUpperCase();
        if (audioLang === lang) opt.selected = true;
        audioSelect.appendChild(opt);
      });

      let autoSelectedSubUrl = null;

      Object.keys(subtitles).forEach(subLang => {
        const opt = document.createElement('option');
        opt.value = subtitles[subLang];
        opt.textContent = subLang.toUpperCase();
        
        if (subLang === lang) {
          opt.selected = true;
          autoSelectedSubUrl = subtitles[subLang];
        }
        
        subtitleSelect.appendChild(opt);
      });

      if (audioSelect.value) video.src = audioSelect.value;
      if (autoSelectedSubUrl) activateSubtitleTrack(autoSelectedSubUrl);
    }

    function renderEpisodesList() {
      episodesContainer.replaceChildren();
      
      (currentMedia.seasons || []).forEach(season => {
        const seasonTitle = document.createElement('h4');
        seasonTitle.style.cssText = 'color: var(--accent-color, #d4af37); margin: 10px 0 6px; font-size: 0.9rem;';
        seasonTitle.textContent = season.i18n?.[lang]?.title || season.i18n?.es?.title || season.title || `Temporada ${season.seasonNumber}`;
        episodesContainer.appendChild(seasonTitle);

        (season.episodes || []).forEach(ep => {
          const btn = document.createElement('a');
          const isCurrent = season.seasonNumber === requestedSeason && ep.episodeNumber === requestedEp;
          btn.className = `ep-modal-item${isCurrent ? ' active' : ''}`;
          const epName = ep.i18n?.[lang]?.title || ep.i18n?.es?.title || ep.title || '';
          btn.textContent = `E${ep.episodeNumber}: ${epName}`;
          btn.href = `play.html?id=${encodeURIComponent(mediaId)}&ep=${ep.episodeNumber}&season=${season.seasonNumber}`;
          episodesContainer.appendChild(btn);
        });
      });
    }

    playPauseBtn.onclick = () => {
      if (video.paused) { video.play(); } else { video.pause(); }
    };

    video.onplay = () => { playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; };
    video.onpause = () => { playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; };

    video.ontimeupdate = () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = `${pct}%`;
      timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    };

    progressBar.onclick = (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      video.currentTime = pos * video.duration;
    };

    audioSelect.onchange = () => {
      const time = video.currentTime;
      video.src = audioSelect.value;
      video.currentTime = time;
      video.play();
    };

    subtitleSelect.onchange = () => {
      activateSubtitleTrack(subtitleSelect.value);
    };

    moreBtn.onclick = () => { modal.hidden = !modal.hidden; };
    backBtn.onclick = () => { location.href = `details.html?id=${encodeURIComponent(mediaId)}`; };

    video.onended = () => {
      if (nextUrl) {
        location.href = nextUrl;
      } else {
        location.href = 'home.html';
      }
    };

    init();
  </script>
</body>
</html>
