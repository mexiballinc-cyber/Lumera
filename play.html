<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera Player</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #000; overflow: hidden; }
    .video-container { position: relative; width: 100vw; height: 100vh; }
    video { width: 100%; height: 100%; object-fit: contain; }
    .player-controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%;
      padding: 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .back-btn { position: absolute; top: 20px; left: 20px; z-index: 10; cursor: pointer; }
    .selector-dropdown { background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="video-container">
    <div class="back-btn" onclick="window.history.back()">
      <svg class="icon-svg" viewBox="0 0 24 24" style="width:36px; height:36px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    
    <video id="lumeraVideoPlayer" controls></video>

    <div class="player-controls">
      <div style="display:flex; gap:15px; align-items:center;">
        <label>Audio / Doblaje:</label>
        <select id="audioSelect" class="selector-dropdown"></select>
        
        <label>Subtítulos:</label>
        <select id="subtitleSelect" class="selector-dropdown"></select>
      </div>
    </div>
  </div>

  <script type="module" src="play.js"></script>
</body>
</html>
