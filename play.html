<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Lumera — Reproductor</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --accent-color: #d4af37;
      --bg-dark: #050505;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
    }
    .player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }
    .player-header-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .player-header-bar * {
      pointer-events: auto;
    }
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      color: #fff;
      text-decoration: none;
      font-weight: 650;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .btn-back:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
      background: rgba(25, 25, 25, 0.85);
    }
    .btn-back svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .player-title-info {
      text-align: right;
    }
    .player-title-info h2 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .player-title-info p {
      font-size: 0.85rem;
      color: var(--accent-color);
    }
    .next-episode-overlay-btn {
      position: absolute;
      bottom: 36px;
      right: 36px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      background: var(--accent-color);
      color: #000;
      border: none;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .next-episode-overlay-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(212,175,55,0.4);
    }
    .player-status-message {
      position: absolute;
      z-index: 15;
      text-align: center;
      padding: 20px;
      background: rgba(10, 10, 10, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(12px);
    }
    @media (max-width: 600px) {
      .player-header-bar {
        padding: 16px 20px;
      }
      .next-episode-overlay-btn {
        bottom: 24px;
        right: 20px;
        padding: 12px 20px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="player-wrapper" id="playerWrapper">
    <header class="player-header-bar" id="playerHeader">
      <a class="btn-back" href="home.html" id="backBtn">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-1.42-1.41L2.17 12l4.24 4.24L12 21.83l1.41-1.42L7.83 14H20v-3z"/></svg>
        <span>Volver</span>
      </a>
      <div class="player-title-info">
        <h2 id="videoTitleDisplay">Cargando video…</h2>
        <p id="videoSubDisplay"></p>
      </div>
    </header>

    <video id="lumeraVideoPlayer" controls autoplay playsinline></video>

    <button id="nextEpisodeBtn" class="next-episode-overlay-btn" hidden type="button">
      <span>Siguiente episodio</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>

    <div id="playerStatus" class="player-status-message" hidden>
      <p id="playerStatusText">Conectando con el servidor de streaming…</p>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js';
    import { getLanguage, t, applyTranslations } from './i18n.js';

    const params = new URLSearchParams(location.search);
    const mediaId = params.get('id');
    const requestedEp = Number(params.get('ep') || 1);
    const requestedSeason = Number(params.get('season') || 1);
    const requestedType = params.get('type');
    const currentLang = getLanguage();
    const $ = (id) => document.getElementById(id);

    const videoNode = $('lumeraVideoPlayer');
    const nextBtn = $('nextEpisodeBtn');
    let nextNavigationUrl = null;

    function applyAccentColor() {
      const savedColor = localStorage.getItem('lumera_accent_color') || '#d4af37';
      document.documentElement.style.setProperty('--accent-color', savedColor);
    }

    function saveWatchProgress(id, season, episode) {
      if (!id) return;
      let history = [];
      try {
        history = JSON.parse(localStorage.getItem('lumera_continue_watching') || localStorage.getItem('lumera_watch_history') || '[]');
      } catch {
        history = [];
      }

      // Eliminar registro previo si existía
      const cleaned = history.filter(item => {
        const itemId = typeof item === 'string' ? item : item.id;
        return itemId !== id;
      });

      // Insertar al inicio con datos de episodio exactos
      cleaned.unshift({
        id: id,
        season: season,
        ep: episode,
        updatedAt: Date.now()
      });

      localStorage.setItem('lumera_continue_watching', JSON.stringify(cleaned.slice(0, 30)));
    }

    async function setupPlayback() {
      applyAccentColor();
      applyTranslations();

      if (!mediaId) {
        alert(t('missingMedia') || 'Contenido no encontrado');
        location.href = 'home.html';
        return;
      }

      $('playerStatus').hidden = false;
      $('playerStatusText').textContent = 'Cargando stream...';

      try {
        const snapshot = await getDoc(doc(db, 'content', mediaId));
        if (!snapshot.exists()) {
          alert('El contenido no existe en la base de datos');
          location.href = 'home.html';
          return;
        }

        const media = snapshot.data();
        const isSeries = media.type === 'series' && requestedType !== 'movie';
        const displayTitle = media.i18n?.[currentLang]?.title || media.i18n?.es?.title || media.title || 'Lumera Content';

        $('videoTitleDisplay').textContent = displayTitle;

        let videoStreamUrl = '';
        let subtitleStreamUrl = '';

        if (!isSeries) {
          // Lógica de Película
          videoStreamUrl = media.sources?.[currentLang] || media.sources?.es || media.videoUrl || media.video || '';
          subtitleStreamUrl = media.subtitles?.[currentLang] || media.subtitles?.es || media.subtitleUrl || media.subUrl || '';
          $('videoSubDisplay').textContent = media.year ? `${media.year}` : '';
          saveWatchProgress(mediaId, 1, 1);
        } else {
          // Lógica de Serie
          const seasonData = media.seasons?.find(s => Number(s.seasonNumber) === requestedSeason) || media.seasons?.[0];
          const episodeData = seasonData?.episodes?.find(e => Number(e.episodeNumber) === requestedEp) || seasonData?.episodes?.[0];

          if (episodeData) {
            videoStreamUrl = episodeData.sources?.[currentLang] || episodeData.sources?.es || episodeData.videoUrl || episodeData.video || '';
            subtitleStreamUrl = episodeData.subtitles?.[currentLang] || episodeData.subtitles?.es || episodeData.subtitleUrl || episodeData.subUrl || '';

            const epTitle = episodeData.i18n?.[currentLang]?.title || episodeData.i18n?.es?.title || episodeData.title || '';
            $('videoSubDisplay').textContent = `T${seasonData?.seasonNumber || requestedSeason} : E${episodeData?.episodeNumber || requestedEp} — ${epTitle}`;

            saveWatchProgress(mediaId, seasonData?.seasonNumber || requestedSeason, episodeData?.episodeNumber || requestedEp);

            // Determinar si existe un siguiente episodio disponible
            const nextEpSameSeason = seasonData?.episodes?.find(e => Number(e.episodeNumber) === (episodeData.episodeNumber + 1));
            if (nextEpSameSeason) {
              nextNavigationUrl = `play.html?id=${encodeURIComponent(mediaId)}&ep=${nextEpSameSeason.episodeNumber}&season=${seasonData.seasonNumber || requestedSeason}`;
            } else {
              const nextSeason = media.seasons?.find(s => Number(s.seasonNumber) === (seasonData?.seasonNumber + 1));
              if (nextSeason?.episodes?.length) {
                const firstEpNextSeason = nextSeason.episodes[0].episodeNumber || 1;
                nextNavigationUrl = `play.html?id=${encodeURIComponent(mediaId)}&ep=${firstEpNextSeason}&season=${nextSeason.seasonNumber}`;
              }
            }
          }
        }

        if (!videoStreamUrl) {
          alert('No hay un video disponible para este idioma o episodio.');
          location.href = `details.html?id=${encodeURIComponent(mediaId)}`;
          return;
        }

        videoNode.src = videoStreamUrl;

        if (subtitleStreamUrl) {
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = currentLang.toUpperCase();
          track.srclang = currentLang;
          track.src = subtitleStreamUrl;
          track.default = true;
          videoNode.appendChild(track);
        }

        $('playerStatus').hidden = true;

        if (nextNavigationUrl) {
          nextBtn.hidden = false;
          nextBtn.onclick = () => {
            location.href = nextNavigationUrl;
          };
        }

        // Auto-avanzar o salir al terminar
        videoNode.onended = () => {
          if (nextNavigationUrl) {
            location.href = nextNavigationUrl;
          } else {
            location.href = 'home.html';
          }
        };

      } catch (error) {
        console.error('Error al inicializar reproductor:', error);
        $('playerStatusText').textContent = 'Error al cargar el reproductor.';
      }
    }

    setupPlayback();
  </script>
</body>
</html>
