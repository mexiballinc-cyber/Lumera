<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera - Panel Ajustes</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-layout { padding: 30px; max-width: 1000px; margin: 80px auto; }
    .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
    .item-card { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid #333; background: #111; }
    .item-card img { width: 100%; height: 100px; object-fit: cover; }
    .delete-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="top-header">
    <div class="left-zone">
      <img src="https://i.imgur.com/0QS9bH3.png" class="logo" alt="Lumera">
      <span style="font-weight:bold; color:var(--accent-color);">Ajustes Globales</span>
    </div>
    <div class="right-zone">
      <a href="admincontenido.html" class="hero-btn" style="padding:8px 16px; font-size:14px;">Ir a CMS Contenido 🎬</a>
      <a href="auth.html" class="icon-btn" title="Volver"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></a>
    </div>
  </header>

  <div class="admin-layout">
    <!-- Pestaña 1: Hero Carousel -->
    <div class="glass-panel" style="padding:20px; margin-bottom:25px;">
      <h3>Gestor de Imágenes Hero</h3>
      <div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">
        <input type="url" id="heroUrl" placeholder="URL Imagen Imgur" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff;">
        
        <div style="display:flex; gap:10px;">
          <select id="heroTargetType" onchange="toggleHeroTarget()" style="padding:10px; background:#111; border:1px solid #333; color:#fff;">
            <option value="content">Vincular a Título del Catálogo</option>
            <option value="custom">Link Personalizado / Externo</option>
          </select>
          
          <select id="heroContentSelect" style="flex:1; padding:10px; background:#111; border:1px solid #333; color:#fff;"></select>
          <input type="text" id="heroCustomLink" placeholder="Ej: details.html?id=... o https://..." style="flex:1; padding:10px; background:#111; border:1px solid #333; color:#fff; display:none;">
        </div>
        
        <button class="hero-btn" onclick="addHero()" style="padding:10px;">Añadir Hero</button>
      </div>
      <h4 style="margin-top:15px; color:var(--text-muted);">Imágenes Activas en Hero:</h4>
      <div id="heroList" class="items-grid"></div>
    </div>

    <!-- Pestaña 2: Avatares -->
    <div class="glass-panel" style="padding:20px; margin-bottom:25px;">
      <h3>Gestor de Avatares de Perfil</h3>
      <div style="display:flex; gap:10px; margin-top:10px;">
        <input type="url" id="avatarUrl" placeholder="URL Imagen Avatar Imgur" style="flex:1; padding:10px; background:#111; border:1px solid #333; color:#fff;">
        <button class="hero-btn" onclick="addAvatar()">Añadir</button>
      </div>
      <h4 style="margin-top:15px; color:var(--text-muted);">Avatares Disponibles:</h4>
      <div id="avatarList" class="items-grid"></div>
    </div>

    <!-- Pestaña 3: Sparks -->
    <div class="glass-panel" style="padding:20px;">
      <h3>Gestor de Sparks (Feed Vertical)</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px;">
        <input type="text" id="sparkTitle" placeholder="Título / Nombre" style="padding:10px; background:#111; border:1px solid #333; color:#fff;">
        <input type="text" id="sparkCat" placeholder="Categoría" style="padding:10px; background:#111; border:1px solid #333; color:#fff;">
      </div>
      <input type="url" id="sparkUrl" placeholder="URL Video MP4/WebArchive" style="width:100%; padding:10px; background:#111; border:1px solid #333; color:#fff; margin-top:10px;">
      <button class="hero-btn" onclick="addSpark()" style="margin-top:10px; width:100%;">Subir Spark</button>

      <h4 style="margin-top:15px; color:var(--text-muted);">Sparks Publicados:</h4>
      <div id="sparkList" style="margin-top:10px;"></div>
    </div>
  </div>

  <script type="module">
    import { db } from './firebase.js';
    import { collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

    window.toggleHeroTarget = function() {
      const type = document.getElementById('heroTargetType').value;
      document.getElementById('heroContentSelect').style.display = type === 'content' ? 'block' : 'none';
      document.getElementById('heroCustomLink').style.display = type === 'custom' ? 'block' : 'none';
    };

    async function loadAllData() {
      // Cargar Títulos para el selector de Hero
      const contentSnap = await getDocs(collection(db, "content"));
      const select = document.getElementById('heroContentSelect');
      select.innerHTML = '<option value="">-- Seleccionar Título --</option>';
      contentSnap.forEach(d => {
        const data = d.data();
        select.innerHTML += `<option value="${d.id}">${data.title || data.name || d.id}</option>`;
      });

      // Cargar Hero
      const heroSnap = await getDocs(collection(db, "hero_slides"));
      const heroList = document.getElementById('heroList');
      heroList.innerHTML = '';
      heroSnap.forEach(d => {
        const data = d.data();
        const targetInfo = data.contentId ? `ID: ${data.contentId}` : (data.customLink || 'Sin vínculo');
        heroList.innerHTML += `
          <div class="item-card">
            <img src="${data.url}">
            <div style="font-size:10px; padding:4px; color:#aaa; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${targetInfo}</div>
            <button class="delete-btn" onclick="removeItem('hero_slides', '${d.id}')">✕</button>
          </div>
        `;
      });

      // Cargar Avatares
      const avatarSnap = await getDocs(collection(db, "avatars"));
      const avatarList = document.getElementById('avatarList');
      avatarList.innerHTML = '';
      avatarSnap.forEach(d => {
        avatarList.innerHTML += `
          <div class="item-card">
            <img src="${d.data().url}" style="border-radius:50%;">
            <button class="delete-btn" onclick="removeItem('avatars', '${d.id}')">✕</button>
          </div>
        `;
      });

      // Cargar Sparks
      const sparkSnap = await getDocs(collection(db, "sparks"));
      const sparkList = document.getElementById('sparkList');
      sparkList.innerHTML = '';
      sparkSnap.forEach(d => {
        sparkList.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:10px; margin-bottom:5px; border-radius:4px;">
            <span><strong>${d.data().name}</strong> (${d.data().category})</span>
            <button onclick="removeItem('sparks', '${d.id}')" style="background:red; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Eliminar</button>
          </div>
        `;
      });
    }

    window.addHero = async function() {
      const url = document.getElementById('heroUrl').value.trim();
      const targetType = document.getElementById('heroTargetType').value;
      const contentId = document.getElementById('heroContentSelect').value;
      const customLink = document.getElementById('heroCustomLink').value.trim();

      if (url) {
        const heroData = { url };
        if (targetType === 'content' && contentId) {
          heroData.contentId = contentId;
          heroData.targetType = 'content';
        } else if (targetType === 'custom' && customLink) {
          heroData.customLink = customLink;
          heroData.targetType = 'custom';
        }
        await addDoc(collection(db, "hero_slides"), heroData);
        document.getElementById('heroUrl').value = '';
        document.getElementById('heroCustomLink').value = '';
        loadAllData();
      }
    };

    window.addAvatar = async function() {
      const url = document.getElementById('avatarUrl').value.trim();
      if (url) { await addDoc(collection(db, "avatars"), { url }); loadAllData(); }
    };

    window.addSpark = async function() {
      const name = document.getElementById('sparkTitle').value.trim();
      const category = document.getElementById('sparkCat').value.trim();
      const videoUrl = document.getElementById('sparkUrl').value.trim();
      if (name && videoUrl) { await addDoc(collection(db, "sparks"), { name, category, videoUrl }); loadAllData(); }
    };

    window.removeItem = async function(coll, id) {
      if (confirm("¿Seguro que deseas eliminar este elemento?")) {
        await deleteDoc(doc(db, coll, id));
        loadAllData();
      }
    };

    loadAllData();
  </script>
</body>
</html>
