<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumera - Streaming Platform</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/cCqp6Qt.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .splash-logo {
      width: 180px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(0.95); opacity: 0.8; }
      to { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="splash-container">
    <img src="https://i.imgur.com/0QS9bH3.png" alt="Lumera Logo" class="splash-logo">
  </div>

  <script type="module">
    import { app } from './app.js';
    
    // Verificación rápida de perfil y sesión en localStorage
    const activeProfile = localStorage.getItem('lumera_active_profile');
    const userSession = localStorage.getItem('lumera_session');

    setTimeout(() => {
      if (userSession && activeProfile) {
        window.location.href = 'home.html';
      } else {
        window.location.href = 'auth.html';
      }
    }, 1200);
  </script>
</body>
</html>
